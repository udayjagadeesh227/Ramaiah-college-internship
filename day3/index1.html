<body>
    <img width="200" height="400" src="../images.jpg" alt="car picture ">
   
    <!-- ../ when image is in the parent folder of the current folder -->
     <!-- ./ for image is in the same folder as the current folder -->
      <figure>
        <img width="200" height="400" src="../images.jpg" alt="car picture ">
        <figcaption>Car picture</figcaption>
      </figure>

      <!-- video element -->
       <video controls autoplay width="400" height="400">

        <source src="" type="video/mp4">
       </video>

        <audio controls>
            <source src="" type="audio/mpeg">

        <br>

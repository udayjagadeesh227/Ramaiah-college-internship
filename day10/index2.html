<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 class="one" id="demo"></h2>
    <div class="result"></div>
    <div class="result"></div>
    <div class="result"></div>
    <h2 id="sample"></h2>
    <h2 class="sample"></h2>
    <h3></h3>
    <label for="">Name</label>
    <input type="text">
    <script>
        document.getElementById("demo").textContent= "Hello";
        let result = document.getElementsByClassName("result")
        result[0].textContent= "This is a result";
        result[1].textContent= "This was a result";
        result[2].textContent= "This will be result";
        document.querySelector("#sample").textContent = "This is a id sample ";
        // # --> id, . --> class
        document.querySelector(".sample").textContent = "This is a class sample ";
        document.querySelector("h3").textContent = "This is a element query ";
        document.querySelector('input[type="text"]');

        

    </script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width:200px;
            height:200px;
            color:brown;
            align-items: center;
            display:flex;
            justify-content: center;
            border:4px solid black;
            border-radius: 10px;
            background: burlywood;
            transition: background 1s ease, 
                        box-shadow 1s ease;
            
        }
        .box:hover{
            color:rgb(38, 17, 3);
            background: aquamarine;
            box-shadow: 0 5px 20px rgb(75, 70, 70);
        }


        
    </style>
</head>
<body>
    <div class="box">Hover me</div>
</body>
</html>
